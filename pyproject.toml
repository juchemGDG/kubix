[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubix"
version = "0.3.0"
description = "Einfach programmieren lernen: eine Figur baut und erkundet eine Würfelwelt (Python für Einsteiger, Klasse 8)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pygame>=2.5"]

[tool.setuptools]
packages = ["kubix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
